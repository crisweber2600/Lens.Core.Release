name: Scheduled branch promotion

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-branch-promotion
  cancel-in-progress: false

env:
  RETRY_ATTEMPTS: '20'
  RETRY_INTERVAL_SECONDS: '30'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - cron: '0 2 * * *'
            source_branch: develop
            target_branch: alpha
          - cron: '0 3 * * 1'
            source_branch: alpha
            target_branch: beta
            retry_attempts: '24'
            retry_interval_seconds: '60'

    steps:
      - name: Open and merge promotion pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          SCHEDULE_CRON: ${{ matrix.cron }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          RETRY_ATTEMPTS: ${{ matrix.retry_attempts || env.RETRY_ATTEMPTS }}
          RETRY_INTERVAL_SECONDS: ${{ matrix.retry_interval_seconds || env.RETRY_INTERVAL_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TRIGGER_SCHEDULE}" != "${SCHEDULE_CRON}" ]]; then
            echo "Skipping ${SOURCE_BRANCH} -> ${TARGET_BRANCH} for schedule ${TRIGGER_SCHEDULE}."
            exit 0
          fi

          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          api_url="https://api.github.com/repos/${owner}/${repo}"
          pr_title="Promote ${SOURCE_BRANCH} to ${TARGET_BRANCH}"
          pr_body="Automated promotion from \`${SOURCE_BRANCH}\` to \`${TARGET_BRANCH}\`."

          api_get() {
            local url="$1"
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "$url"
          }

          api_post() {
            local url="$1"
            local payload="$2"
            curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$url"
          }

          api_put_with_status() {
            local url="$1"
            local payload="$2"
            curl --silent --show-error \
              --request PUT \
              --write-out '\n%{http_code}' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$url"
          }

          existing_pr="$(api_get "${api_url}/pulls?state=open&head=${owner}:${SOURCE_BRANCH}&base=${TARGET_BRANCH}")"
          pr_number="$(jq -r '.[0].number // empty' <<< "${existing_pr}")"

          if [[ -z "${pr_number}" ]]; then
            comparison="$(api_get "${api_url}/compare/${TARGET_BRANCH}...${SOURCE_BRANCH}")"
            ahead_by="$(jq -r '.ahead_by // 0' <<< "${comparison}")"

            if [[ "${ahead_by}" == "0" ]]; then
              echo "No changes to promote from ${SOURCE_BRANCH} to ${TARGET_BRANCH}."
              exit 0
            fi

            create_payload="$(jq -n \
              --arg title "${pr_title}" \
              --arg head "${SOURCE_BRANCH}" \
              --arg base "${TARGET_BRANCH}" \
              --arg body "${pr_body}" \
              '{title: $title, head: $head, base: $base, body: $body}')"

            created_pr="$(api_post "${api_url}/pulls" "${create_payload}")"
            pr_number="$(jq -r '.number' <<< "${created_pr}")"
            echo "Created PR #${pr_number}."
          else
            echo "Using existing PR #${pr_number}."
          fi

          mergeable="null"
          mergeable_state="unknown"

          for ((attempt = 1; attempt <= RETRY_ATTEMPTS; attempt++)); do
            echo "Checking merge status for PR #${pr_number} (attempt ${attempt}/${RETRY_ATTEMPTS})."
            pr_details="$(api_get "${api_url}/pulls/${pr_number}")"
            merged="$(jq -r '.merged' <<< "${pr_details}")"

            if [[ "${merged}" == "true" ]]; then
              echo "PR #${pr_number} is already merged."
              exit 0
            fi

            mergeable="$(jq -r '.mergeable // "null" | tostring' <<< "${pr_details}")"
            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<< "${pr_details}")"

            if [[ "${mergeable}" == "true" ]]; then
              break
            fi

            if [[ "${mergeable}" == "false" && "${mergeable_state}" != "unknown" ]]; then
              echo "PR #${pr_number} is not mergeable (${mergeable_state}); leaving PR open for the next scheduled run."
              exit 0
            fi

            sleep "${RETRY_INTERVAL_SECONDS}"
          done

          if [[ "${mergeable}" != "true" ]]; then
            echo "PR #${pr_number} did not become mergeable after all retries (last state: ${mergeable_state}); leaving PR open for the next scheduled run."
            exit 0
          fi

          merge_payload="$(jq -n \
            --arg commit_title "${pr_title}" \
            '{commit_title: $commit_title, merge_method: "merge"}')"

          merge_response="$(api_put_with_status "${api_url}/pulls/${pr_number}/merge" "${merge_payload}")"

          merge_status="$(tail -n1 <<< "${merge_response}")"
          merge_body="$(sed '$d' <<< "${merge_response}")"

          if [[ "${merge_status}" != "200" ]]; then
            echo "Failed to merge PR #${pr_number}: ${merge_body}"
            exit 1
          fi

          merged="$(jq -r '.merged' <<< "${merge_body}")"

          if [[ "${merged}" != "true" ]]; then
            echo "GitHub did not merge PR #${pr_number}: ${merge_body}"
            exit 1
          fi

          echo "Merged PR #${pr_number} from ${SOURCE_BRANCH} to ${TARGET_BRANCH}."
