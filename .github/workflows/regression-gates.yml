name: Regression Gates

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "_bmad/lens-work/**"
      - ".github/prompts/**"
      - ".github/workflows/regression-gates.yml"
  push:
    branches: [main, develop]
    paths:
      - "_bmad/lens-work/**"
      - ".github/prompts/**"
      - ".github/workflows/regression-gates.yml"
  workflow_dispatch:

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run recurring-regression gates
        run: |
          python - <<'PY'
          import importlib.util
          import inspect
          import tempfile
          import traceback
          from pathlib import Path

          test_files = [
              Path("_bmad/lens-work/scripts/tests/test-regression-gates.py"),
              Path("_bmad/lens-work/scripts/tests/test-wrapper-path-precedence.py"),
          ]
          failures = []

          for test_file in test_files:
              spec = importlib.util.spec_from_file_location(test_file.stem.replace("-", "_"), test_file)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"Unable to load test module from {test_file}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)

              for name, test in sorted(vars(module).items()):
                  if not name.startswith("test_") or not callable(test):
                      continue

                  kwargs = {}
                  tmpdirs = []
                  for param_name in inspect.signature(test).parameters:
                      if param_name != "tmp_path":
                          raise RuntimeError(
                              f"Unsupported fixture '{param_name}' for {test_file}:{name}. "
                              "Only 'tmp_path' is supported."
                          )
                      tmpdir = tempfile.TemporaryDirectory()
                      tmpdirs.append(tmpdir)
                      kwargs[param_name] = Path(tmpdir.name)

                  try:
                      test(**kwargs)
                      print(f"PASS {test_file}:{name}")
                  except Exception as exc:
                      failures.append((test_file, name, exc))
                      print(f"FAIL {test_file}:{name}: {exc!r}")
                      traceback.print_exc()
                  finally:
                      for tmpdir in tmpdirs:
                          tmpdir.cleanup()

          if failures:
              raise SystemExit(1)
          PY
