name: Regression Gates

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "_bmad/lens-work/**"
      - ".github/prompts/**"
      - ".github/workflows/regression-gates.yml"
  push:
    branches: [main, develop]
    paths:
      - "_bmad/lens-work/**"
      - ".github/prompts/**"
      - ".github/workflows/regression-gates.yml"
  workflow_dispatch:

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install "pytest==9.0.3" "PyYAML==6.0.3"

      - name: Run recurring-regression gates
        run: |
          python -m pytest \
            _bmad/lens-work/scripts/tests/test-regression-gates.py \
            _bmad/lens-work/scripts/tests/test-wrapper-path-precedence.py \
            -q
